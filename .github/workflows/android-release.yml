name: Android CI Release workflow

on:
  push:
    tags: 
        - 'v?[0-9]+.[0-9]+.[0-9]+'  # Trigger on tags like 1.0.0, 2.5.10 or v1.2.3
    branches: 
        - 'release/**'  # Push events to branches matching refs/heads/release/10
  workflow_dispatch: # Allow manual trigger

env:
  GRADLE_OPTS: -Dorg.gradle.jvmargs="-Xmx4g -XX:MaxMetaspaceSize=1g -XX:+HeapDumpOnOutOfMemoryError"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: 21
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: wrapper
          cache-read-only: false
          gradle-home-cache-cleanup: true
          validate-wrappers: true
          build-scan-publish: true
          build-scan-terms-of-use-url: 'https://gradle.com/terms-of-service'
          build-scan-terms-of-use-agree: 'yes'

      - name: Decode Keystore
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 --decode > androidApp/release.keystore

      - name: Build and bundle release
        run: ./gradlew assembleRelease bundleRelease --no-configuration-cache --stacktrace --scan
        env:
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: isida
          GRADLE_BUILD_ACTION_CACHE_DEBUG_ENABLED: true

      - name: Upload build reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-reports-${{ github.run_id }}
          path: |
              **/build/reports/
              **/build/test-results/
          retention-days: 7
  
      - name: Upload release build to Firebase distribution
        if: success()
        run: ./gradlew appDistributionUploadRelease
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}

      - name: Deploy to Google Play
        if: startsWith(github.ref, 'refs/tags') && success()
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.ANDROID_PUBLISHER_CREDENTIALS }}
          packageName: ua.isida
          releaseFiles: androidApp/build/outputs/bundle/release/*.aab
          track: internal
